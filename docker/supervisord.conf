[supervisord]
nodaemon = true
user = root
logfile = /dev/null
pidfile = /tmp/supervisord.pid

[program:apache]
command = /usr/sbin/apache2ctl -D FOREGROUND
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue]
command = php /var/www/html/laravel/artisan queue:listen --tries=3 --sleep=3 --timeout=90
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command = /bin/sh -c "while true; do php /var/www/html/laravel/artisan schedule:run; sleep 60; done"
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
