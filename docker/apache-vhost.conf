<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/laravel/public

    <Directory /var/www/html/laravel/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hxscreen-error.log
    CustomLog ${APACHE_LOG_DIR}/hxscreen-access.log combined
</VirtualHost>
